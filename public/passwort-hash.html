<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passwort-Hash erzeugen</title><style>body{font:16px system-ui;max-width:34rem;margin:2rem auto;padding:0 1rem}input,button{font:inherit;padding:.7rem;width:100%;box-sizing:border-box;margin:.3rem 0}textarea{width:100%;height:6rem;font:12px monospace}</style></head>
<body><h1>Passwort-Hash erzeugen</h1>
<p>Rechnet nur in deinem Browser (PBKDF2, WebCrypto), es wird nichts gesendet. Den Hash trägst du beim Hoster als <code>PA_REGISTRIER_HASH</code> (Anmeldepasswort für die Registrierung), <code>PA_START_HASH</code> (Startcode) oder im Feld <code>hash</code> von <code>PA_KONTEN_SAAT</code> (feste Konten) ein, nie das Passwort.</p>
<input id="p" type="password" placeholder="Passwort (mindestens 12 Zeichen empfohlen, 8 Zeichen Mindestmaß)" autocomplete="new-password"><button id="b">Hash erzeugen</button><textarea id="o" readonly></textarea>
<script>
document.getElementById('b').onclick=async()=>{const p=document.getElementById('p').value;if(p.length<8){document.getElementById("o").value='Zu kurz (mindestens 8 Zeichen).';return}
const salz=crypto.getRandomValues(new Uint8Array(16)),hex=a=>[...new Uint8Array(a)].map(x=>x.toString(16).padStart(2,'0')).join('');
const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
const h=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salz,iterations:600000},k,256);
document.getElementById('o').value='pbkdf2$600000$'+hex(salz)+'$'+hex(h)};
</script></body></html>
