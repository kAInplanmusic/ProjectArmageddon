name: CI

on:
  push:
    branches: [main]
    # Release-Tags (Konvention: docs/deploy-plan.md Abschnitt 3) bauen zusätzlich das Release-Paket.
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Verkabelung (BLD-2): lädt die vier Einstiegspunkte (shared, engine, server, client) einmal.
      # ~2 s; fällt sofort, wenn ein Import ins Leere zeigt, noch bevor Lint und Tests laufen.
      - name: Verkabelung (validate)
        run: npm run validate

      # Linting läuft zuerst: es findet Fehler schneller als die Testsuite.
      - name: Lint
        run: npm run lint

      # AUDIT-BEFUND (2026-09-20): Die damals 19 Prüfwerkzeuge (heute mehr, Liste
      # `GATES` in scripts/checks.mjs) (check:fuses,
      # check:effects, matrix:check, check:achievements, check:time …) liefen in
      # dieser Pipeline NICHT. Sie haben eigene Exit-Codes und sind damit Gates —
      # aber ein Gate, das niemand aufruft, ist eine Empfehlung. Genau so konnten
      # eine veraltete Wirkungs-Übersicht und acht Waffen mit Wirkungen ohne Motor
      # unbemerkt bleiben.
      #
      # Laufzeit aller Gates: ~30 s.
      - name: Prüfwerkzeuge (alle Gates)
        run: npm run checks

      - name: Katalog und Tests
        run: npm test

      - name: Build
        run: npm run build

      # Das Build-Ergebnis wird abgelegt, damit es ohne lokalen Build
      # heruntergeladen und ausgeliefert werden kann.
      - name: Build-Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

      # Das Performance-Gate misst, ob das 60-Hz-Budget eingehalten wird.
      # Es schlägt fehl, wenn mehr als 5 % der Ticks über 16,7 ms liegen.
      # Das Ladebudget (Haupt-Bundle roh/gzip, Startgröße, dist gesamt, keine Sourcemaps;
      # Grenzen in scripts/bundle-grenzen.json) läuft NICHT hier, sondern als Gate
      # `check:bundle` im Schritt „Prüfwerkzeuge“ oben (baut selbst, ~6 s). Messwerte und
      # Lighthouse-Vergleich: docs/ladezeit.md.
      - name: Performance-Budget
        run: npm run perf -- --ticks=12000

  # Balance-Bericht (BLD-2): Messung über den ganzen Waffenkatalog, ~1,5 min, eigener Job
  # (verlängert die Pipeline nicht). Er ist ein BERICHT, kein Gate — `balance-report.mjs`
  # endet nur bei falschen Argumenten mit Fehler; seine Rechenwege prüft
  # `tests/balance-report.test.js` in `npm test`. Das Ergebnis liegt als Artefakt bei jedem
  # Lauf vor, damit Balance-Änderungen zwischen zwei Commits vergleichbar sind.
  #
  # `smoke:fast` läuft hier bewusst NICHT: Es ist validate + Lint + ein Ausschnitt von
  # `npm test` + Serverstart — alles steht oben schon vollständig in der Pipeline.
  balance:
    name: Balance-Bericht
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Balance messen
        shell: bash # mit pipefail: ein Abbruch vor `tee` macht den Schritt rot
        run: |
          npm run --silent balance | tee balance.txt
          npm run --silent balance -- --json > balance.json

      - name: Balance-Bericht ablegen
        uses: actions/upload-artifact@v4
        with:
          name: balance
          path: |
            balance.txt
            balance.json
          retention-days: 30

  # Release-Paket (REL-1/DEP-1): nur bei einem Tag `v*`, nach grünem `test`. Baut den Client
  # (Git-Stand aus GITHUB_SHA, Bauzeit = Commit-Zeit → reproduzierbar) und legt Archiv und
  # Prüfsumme als Artefakt ab. Es gibt bewusst KEINEN Deploy-Schritt: Ausrollen auf einen
  # Knoten ist eine Handlung des Betreibers (AGENTS.md §5, docs/deploy-plan.md Abschnitt 5).
  release-paket:
    name: Release-Paket
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tag passt zur Version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu package.json ($version) — erwartet v$version"
            exit 1
          fi

      - name: Bauen und packen
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          npm run build
          node scripts/release/paket.mjs

      - name: Release-Paket ablegen
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            release/*.tar.gz
            release/*.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error

  # E2E in vier Teilen (je eigener Runner): Die Suite läuft mit einem Worker (feste Ports der
  # Multiplayer-Tests), am Stück dauert sie zu lange. Playwright teilt die Specs mit `--shard`
  # deterministisch auf; jeder Teil startet seinen eigenen Dev-Server und legt Bericht und
  # Spuren unter eigenem Namen ab. `fail-fast: false`: ein roter Teil bricht die anderen nicht ab.
  e2e:
    name: Browser-Tests (Teil ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Auf dem Runner gibt es kein vorinstalliertes Chrome; das Skript
      # installiert die Abhängigkeiten des Browser-Bundles nur bei Bedarf.
      - name: Chromium-Abhängigkeiten installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests
        # `visuell.spec` (Menü, Lobby, HUD) läuft hier MIT: Der Strukturvergleich
        # (tests/e2e/helfer/struktur-vergleich.mjs) bestand auf diesem Runner zweimal
        # 6/6 gegen die auf einem Entwicklungsrechner erzeugten Baselines.
        #
        # Die Variable sperrt nur noch `vergleich-screenshots.spec`: Es ERZEUGT die
        # Bilder des Vergleichsdossiers und überschreibt getrackte Dateien — auf einem
        # Runner entstünden Bilder einer fremden Maschine. Einzelheiten:
        # docs/testgrenzen.md.
        env:
          PA_OHNE_BILDVERGLEICH: '1'
        run: npx playwright test --shard=${{ matrix.shard }}/4

      # Bericht und Spuren (trace: retain-on-failure) je Teil, auch wenn der Teil rot ist.
      - name: E2E-Bericht ablegen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-teil-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
