name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Linting läuft zuerst: es findet Fehler schneller als die Testsuite.
      - name: Lint
        run: npm run lint

      # AUDIT-BEFUND (2026-09-20): Die 19 Prüfwerkzeuge (check:fuses,
      # check:effects, matrix:check, check:achievements, check:time …) liefen in
      # dieser Pipeline NICHT. Sie haben eigene Exit-Codes und sind damit Gates —
      # aber ein Gate, das niemand aufruft, ist eine Empfehlung. Genau so konnten
      # eine veraltete Wirkungs-Übersicht und acht Waffen mit Wirkungen ohne Motor
      # unbemerkt bleiben.
      #
      # Laufzeit aller Gates: ~30 s.
      - name: Prüfwerkzeuge (alle Gates)
        run: npm run checks

      - name: Katalog und Tests
        run: npm test

      - name: Build
        run: npm run build

      # Das Build-Ergebnis wird abgelegt, damit es ohne lokalen Build
      # heruntergeladen und ausgeliefert werden kann.
      - name: Build-Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

      # Das Performance-Gate misst, ob das 60-Hz-Budget eingehalten wird.
      # Es schlägt fehl, wenn mehr als 5 % der Ticks über 16,7 ms liegen.
      - name: Performance-Budget
        run: npm run perf -- --ticks=12000

  e2e:
    name: Browser-Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Auf dem Runner gibt es kein vorinstalliertes Chrome; das Skript
      # installiert die Abhängigkeiten des Browser-Bundles nur bei Bedarf.
      - name: Chromium-Abhängigkeiten installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests
        # Bildvergleiche sind hier ABSICHTLICH aus: ihre Baselines hängen an der
        # Render-Umgebung (Schriftmetriken, Rasterung), nicht nur am Code.
        # Gemessen am 2026-10-25: derselbe Code auf einem anderen Rechner ergab
        # 104.130 abweichende Pixel (31,6 %). Ein Vergleich auf einem fremden
        # Runner prüft den Unterschied zwischen zwei Rechnern, nicht das Spiel.
        #
        # Die Tests verschwinden dabei nicht: sie werden als ÜBERSPRUNGEN mit
        # Begründung gemeldet. Lokal (Variable nicht gesetzt) laufen sie und sind
        # dort das Gate. Einzelheiten: docs/testgrenzen.md.
        env:
          PA_OHNE_BILDVERGLEICH: '1'
        run: npm run test:e2e
