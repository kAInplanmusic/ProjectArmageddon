name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Modulvalidierung
        run: npm run validate

      - name: Waffenkatalog ist aktuell
        run: |
          node scripts/build-weapon-catalog.mjs
          git diff --exit-code src/shared/config/weapons.js \
            || (echo "::error::Waffenkatalog ist veraltet. Bitte 'npm run weapons:build' ausführen." && exit 1)

      - name: Unit- und Integrationstests
        run: npm test

      - name: Headless-Smoke
        run: npm run smoke

      - name: Production-Build
        run: npm run build

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests
        run: npx playwright test --project=chromium

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
