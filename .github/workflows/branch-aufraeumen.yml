# Räumt Branches auf, deren Inhalt bereits vollständig in main steckt.
# Sicherheitsnetz: Gelöscht wird nur, was laut Compare-API 0 Commits vor main liegt
# (also nichts, was nicht schon in main ist). Standard ist ein Probelauf (dry_run).
name: Branches aufräumen

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Probelauf: nur anzeigen, nichts löschen'
        type: boolean
        default: true
      verworfene:
        description: 'Zusätzlich Branches aus .github/branch-verworfen.txt löschen, auch MIT Commits (geprüft, übernommen/archiviert/überholt)'
        type: boolean
        default: false
  # Gemergte Pull Requests räumen ihren Quell-Branch selbst weg (nur Branches im selben Repo).
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  liste:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Branches aus .github/branch-loeschliste.txt prüfen und löschen
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -u
          while IFS= read -r b; do
            [ -z "$b" ] && continue
            case "$b" in main|master) echo "SKIP  $b (geschützt)"; continue;; esac
            enc=$(printf '%s' "$b" | sed 's#/#%2F#g')
            ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${enc}" --jq .ahead_by 2>/dev/null || echo "fehlt")
            if [ "$ahead" = "fehlt" ]; then echo "SKIP  $b (existiert nicht)"; continue; fi
            if [ "$ahead" != "0" ]; then echo "SKIP  $b ($ahead Commits nicht in main)"; continue; fi
            if [ "$DRY" = "true" ]; then echo "DRY   $b würde gelöscht"; else
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${b}" && echo "DEL   $b"
            fi
          done < .github/branch-loeschliste.txt

      - name: Geprüfte, verworfene Branches löschen (nur auf ausdrücklichen Wunsch)
        if: ${{ inputs.verworfene }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -u
          while IFS= read -r b; do
            [ -z "$b" ] && continue
            case "$b" in main|master) echo "SKIP  $b (geschützt)"; continue;; esac
            if [ "$DRY" = "true" ]; then echo "DRY   $b würde gelöscht (verworfen)"; else
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${b}" && echo "DEL   $b" || echo "SKIP  $b (existiert nicht)"
            fi
          done < .github/branch-verworfen.txt

  gemergt:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Quell-Branch des gemergten PR löschen
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # 422 = Branch ist schon weg (z. B. durch die GitHub-Einstellung "Branch nach Merge löschen"): kein Fehler.
          if out=$(gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${REF}" 2>&1); then echo "DEL   ${REF}";
          elif echo "$out" | grep -q "HTTP 422"; then echo "SKIP  ${REF} (existiert nicht mehr)";
          else echo "$out"; exit 1; fi
