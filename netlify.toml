# Option D (docs/zugang-www.md): statischer Client + Login/Start als Funktionen. Keine Geheimnisse in dieser Datei —
# HCLOUD_TOKEN, PA_WEB_GEHEIMNIS, PA_SPIEL_GEHEIMNIS, PA_REGISTRIER_HASH, PA_START_HASH, PA_KONTEN_SAAT setzt der
# Auftraggeber in der Netlify-Oberfläche (docs/zugang-www.md). Nutzerdaten liegen in Netlify Blobs (kein Zusatzkonto).
[build]
  command = "npm ci && PA_WEB_BUILD=1 npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["scripts/betrieb/server-erstinstallation.sh"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
